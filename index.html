<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEAMJINU FESTIVAL SIGNATURES</title>
  <!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="header-container">
  <img id="header-image" src="images/TEAMJINU FESTIVAL HEADER.jpg" alt="Header Image">

 <div id="category-buttons">
  <img class="category-btn" src="thumbnails/btn-1000s.png" data-category="1000s" alt="1000s">
  <img class="category-btn" src="thumbnails/btn-2000s.png" data-category="2000s" alt="2000s">
  <img class="category-btn" src="thumbnails/btn-3000s.png" data-category="3000s" alt="3000s">
  <img class="category-btn" src="thumbnails/btn-4000s.png" data-category="4000s" alt="4000s">
  <img class="category-btn" src="thumbnails/btn-5000s.png" data-category="5000s" alt="5000s">
  <img class="category-btn" src="thumbnails/btn-10000s.png" data-category="10000s" alt="10000s">
  <img class="category-btn" src="thumbnails/btn-20000s.png" data-category="20000+" alt="20000+">
</div>
</div>


<div id="cards-container">
  <!-- Cards will be generated by JS -->
</div>

<!-- Modal for clicked card -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span id="modal-close">&times;</span>
    <img id="modal-img" src="" alt="">
    <h2 id="modal-title"></h2>
    <div id="modal-performers"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
