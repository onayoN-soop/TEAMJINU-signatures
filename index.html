<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dance Choreos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Dance Choreos</h1>
  <div class="grid">
    <!-- Example cards -->
    <div class="card" onclick="openSong('Song 1')">
      <img src="thumbnails/song1.png" alt="Song 1">
      <h3>Song 1</h3>
    </div>
    <div class="card" onclick="openSong('Song 2')">
      <img src="thumbnails/song2.png" alt="Song 2">
      <h3>Song 2</h3>
    </div>
    <div class="card" onclick="openSong('Song 3')">
      <img src="thumbnails/song3.png" alt="Song 3">
      <h3>Song 3</h3>
    </div>
    <!-- Add more cards here following the same format -->
  </div>

  <!-- Modal -->
  <div id="modal" onclick="closeModal()">
    <div class="modal-content">
      <p id="placeholderText">Video coming soon!</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
