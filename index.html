<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEAMJINU FESTIVAL SIGNATURES</title>
  <!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Header Image with overlay buttons -->
<div id="header-container">
  <img id="header-image" src="images/TEAMJINU FESTIVAL HEADER.jpg" alt="Header Image">
  
  <!-- Overlay buttons at the bottom -->
  <div id="category-buttons">
    <button data-category="1000s">1000s</button>
    <button data-category="2000s">2000s</button>
    <button data-category="3000s">3000s</button>
    <button data-category="4000s">4000s</button>
    <button data-category="5000s">5000s</button>
    <button data-category="10000s">10000s</button>
    <button data-category="20000+">20000+</button>
  </div>
</div>

<div id="cards-container">
  <!-- Cards will be generated by JS -->
</div>

<!-- Modal for clicked card -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span id="modal-close">&times;</span>
    <img id="modal-img" src="" alt="">
    <h2 id="modal-title"></h2>
    <div id="modal-performers"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
